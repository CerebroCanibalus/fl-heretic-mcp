[package]
name = "concurrency"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
heretic-core = { path = "../../crates/heretic-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
tokio = { version = "1", features = ["net", "io-util", "rt", "macros", "time"] }
