[package]
name        = "heretic-fl"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Bridge MIDI SysEx para FL Studio (controller script Python ↔ daemon Rust)"

[dependencies]
heretic-core       = { path = "../heretic-core" }

tokio              = { workspace = true }
tokio-util         = { workspace = true }
async-trait        = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
anyhow             = { workspace = true }
tracing            = { workspace = true }
rand               = { workspace = true }
hex                = { workspace = true }
base64             = { workspace = true }

# MIDI — única dependencia nativa (bindings via libsane-rtmidi en Windows)
midir              = "0.10"

[target.'cfg(windows)'.dependencies]
# Nada extra en Windows — midir usa WinMM por defecto

[target.'cfg(target_os = "linux")'.dependencies]
# ALSA en Linux — midir ya lo trae opcionalmente

[target.'cfg(target_os = "macos")'.dependencies]
# CoreMIDI en macOS — midir ya lo trae opcionalmente

[dev-dependencies]
tempfile   = "3.13"
tokio      = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }