[package]
name        = "heretic-fl"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Bridge al fLMCP Bridge de FL Studio (file-RPC + TCP JSON-RPC)"

[dependencies]
heretic-core       = { path = "../heretic-core" }

tokio              = { workspace = true }
tokio-util         = { workspace = true }
async-trait        = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
anyhow             = { workspace = true }
tracing            = { workspace = true }

# File I/O
[target.'cfg(windows)'.dependencies]
tokio   = { workspace = true }
# Para el control del proceso de FL Studio (EnumWindows / PostMessageW
# / GetWindowThreadProcessId). El sandbox de FL no tiene nada de esto: el
# control de proceso vive aqui, en el daemon, fuera de FL.
windows  = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile   = "3.13"
tokio      = { workspace = true, features = ["macros", "rt-multi-thread"] }